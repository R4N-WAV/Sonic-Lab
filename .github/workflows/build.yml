name: Build ATELIER (Windows x64 VST3 + installer)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version info
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Atelier VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $sha = "${{ github.sha }}".Substring(0,7)
          "version=$v" >> $env:GITHUB_OUTPUT
          "build=build ${{ github.run_number }} ($sha)" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + tests
        run: cmake --build build --config Release --target Atelier_VST3 sonic_core_tests atelier_plugin_tests --parallel

      - name: Core DSP tests
        run: build\Release\sonic_core_tests.exe

      - name: Plugin processor tests (headless)
        run: build\plugin\Release\atelier_plugin_tests.exe

      - name: Validate plugin (pluginval, strictness 5)
        id: pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = "build\plugin\Atelier_artefacts\Release\VST3\ATELIER.vst3"
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs --validate $p
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build installer
        shell: pwsh
        run: |
          $vst3 = (Resolve-Path "build\plugin\Atelier_artefacts\Release\VST3\ATELIER.vst3").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\atelier.iss `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DBuildInfo=${{ steps.ver.outputs.build }}" `
            "/DVst3Dir=$vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build\plugin\Atelier_artefacts\Release\VST3\ATELIER.vst3 -DestinationPath ATELIER_by_R4N_${{ steps.ver.outputs.version }}_VST3_portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ATELIER_by_R4N_Setup_${{ steps.ver.outputs.version }}
          path: installer/output/*.exe

      - name: Upload portable VST3
        uses: actions/upload-artifact@v4
        with:
          name: ATELIER_by_R4N_VST3_portable_${{ steps.ver.outputs.version }}
          path: ATELIER_by_R4N_*_portable.zip

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## ATELIER ${{ steps.ver.outputs.version }} - ${{ steps.ver.outputs.build }}" >> $env:GITHUB_STEP_SUMMARY
          "- Core DSP + plugin processor tests: passed (build would have stopped otherwise)" >> $env:GITHUB_STEP_SUMMARY
          "- pluginval strictness 5: ${{ steps.pluginval.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- Download the installer from the Artifacts section below." >> $env:GITHUB_STEP_SUMMARY
